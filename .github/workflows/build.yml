name: Build Tweak

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          export THEOS=$HOME/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          brew install ldid
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS
          mkdir -p $THEOS/sdks
          # 用 Xcode 自带 SDK（ditto 正确处理 symlink，避免 unzip 的权限问题）
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          ditto "$SDK" "$THEOS/sdks/iPhoneOS.sdk"
          ls -la $THEOS/sdks/

      - name: Build package
        run: |
          export THEOS=$HOME/theos
          make clean
          make package

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: SwiftgramAntiRecallMarker-deb
          path: packages/*.deb
          if-no-files-found: error
