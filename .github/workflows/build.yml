name: Build Tweak

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          export THEOS=$HOME/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS
          # 下载 iOS SDK
          curl -L -o /tmp/sdks.zip https://github.com/theos/sdks/archive/refs/heads/master.zip
          mkdir -p /tmp/sdks
          unzip -q /tmp/sdks.zip -d /tmp/sdks
          mkdir -p $THEOS/sdks
          cp -r /tmp/sdks/sdks-master/*.sdk $THEOS/sdks/ || true
          ls -la $THEOS/sdks/

      - name: Build package
        run: |
          export THEOS=$HOME/theos
          make clean
          make package

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: SwiftgramAntiRecallMarker-deb
          path: packages/*.deb
          if-no-files-found: error
